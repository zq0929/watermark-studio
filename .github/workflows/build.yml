name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            script: dist:mac
            artifact: dist/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci --no-audit --fund=false
        env:
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_maxtimeout: '120000'
      - name: 打包
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder 需要从 GitHub Releases 拉 nsis / winCodeSign 等工具包；
          # 近期 GitHub CDN 对 winCodeSign-2.6.0 持续 504，改用镜像更稳。
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      - name: 冒烟自检
        if: runner.os == 'macOS'
        run: npm run smoke -- --out=./.tmp-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: watermark-studio-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
