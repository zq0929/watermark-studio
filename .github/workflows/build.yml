name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac
            artifact: dist/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 打包
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 冒烟自检
        if: runner.os == 'macOS'
        run: npm run smoke -- --out=./.tmp-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: watermark-studio-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
